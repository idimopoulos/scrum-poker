name: Deploy Direct to Server

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout release
      uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run type checking
      run: npm run check

    - name: Build application
      run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: verify

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        envs: TAG
        script: |
          set -e

          # Navigate to project directory
          cd /opt/apps/scrum

          # Check out the released tag
          git fetch --tags origin
          git checkout --detach "$TAG"

          # Build first so the running container stays up during the build
          docker compose build

          # Recreate the container with the new image
          docker compose up -d

          # Remove only this project's old (dangling) images
          docker image prune -f --filter "label=com.docker.compose.project=scrum"

          # Verify deployment
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5001 > /dev/null 2>&1; then
              echo "Deployed $TAG successfully!"
              exit 0
            fi
            sleep 2
          done
          echo "Deployment verification failed"
          exit 1
